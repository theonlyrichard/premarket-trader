<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Market Research Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&display=swap');

  :root {
    --bg: #0a0d12;
    --bg-elevated: #12161d;
    --bg-card: #161b24;
    --border: #242b38;
    --border-bright: #3a4555;
    --ink: #e8ecf1;
    --ink-dim: #8a95a8;
    --ink-faint: #5a6578;
    --accent: #c9a961;
    --accent-dim: #8a7542;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.55;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201, 169, 97, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(96, 165, 250, 0.03) 0%, transparent 40%);
  }

  .container { max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; }

  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 42px;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 500; }
  .subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--ink-faint); margin-top: 10px; }

  .meta { text-align: right; font-size: 11px; color: var(--ink-dim); }
  .meta .date { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); }
  .meta .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.error { background: var(--red); }
  .status-dot.idle { background: var(--ink-faint); }

  /* Scan button */
  .scan-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  button {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--ink);
    padding: 12px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  button.primary:hover { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .last-scan { font-size: 11px; color: var(--ink-faint); }

  /* Tracker stats bar */
  .tracker {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 16px 20px;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 24px;
    font-size: 11px;
  }
  .tracker-item .label {
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
    font-size: 10px;
    margin-bottom: 4px;
  }
  .tracker-item .value {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
  }
  .tracker-item .detail { color: var(--ink-dim); margin-top: 2px; }

  /* Macro banner */
  .macro-banner {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .macro-banner h3 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 14px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }
  .macro-events { display: flex; gap: 16px; flex-wrap: wrap; }
  .macro-event {
    font-size: 12px;
    padding: 6px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-left: 2px solid var(--amber);
  }
  .macro-event.high { border-left-color: var(--red); }
  .macro-event .time { color: var(--accent); margin-right: 8px; font-weight: 500; }
  .macro-event .name { color: var(--ink); }
  .no-events { color: var(--ink-faint); font-style: italic; font-size: 12px; }

  /* Recommendation cards */
  .recs-header {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 24px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .recs-header .count { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.15em; }

  .rec-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .rec-card.high { border-color: var(--green); }
  .rec-card.medium { border-color: var(--accent); }
  .rec-card.low { border-color: var(--border-bright); opacity: 0.8; }

  .rec-head {
    padding: 24px 28px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 24px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .rec-symbol {
    font-family: 'Fraunces', serif;
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .rec-summary .direction {
    display: inline-block;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .rec-summary .direction.CALL { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid var(--green); }
  .rec-summary .direction.PUT { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid var(--red); }
  .style-badge { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; border: 1px solid; }
  .style-badge.scalp { color: var(--blue); border-color: var(--blue); background: rgba(96, 165, 250, 0.1); }
  .style-badge.swing { color: var(--amber); border-color: var(--amber); background: rgba(251, 191, 36, 0.1); }
  .rec-summary .headline {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--ink);
    font-style: italic;
    margin-top: 4px;
  }
  .rec-summary .subline { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }

  .rec-conviction { text-align: right; }
  .rec-conviction .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .rec-conviction .value {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .rec-conviction .value.High { color: var(--green); }
  .rec-conviction .value.Medium { color: var(--accent); }
  .rec-conviction .value.Low { color: var(--ink-dim); }
  .rec-conviction .score { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  .rec-body {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0;
  }
  @media (max-width: 720px) { .rec-body { grid-template-columns: 1fr; } }

  .rec-levels { padding: 24px 28px; border-right: 1px solid var(--border); }
  .rec-levels h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .level-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .level-row:last-child { border-bottom: none; }
  .level-row .k {
    color: var(--ink-faint);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    align-self: center;
  }
  .level-row .v {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .level-row .v.target { color: var(--green); }
  .level-row .v.stop { color: var(--red); }
  .level-row .v.accent { color: var(--accent); }

  .rec-factors { padding: 24px 28px; }
  .rec-factors h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .factor-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 12px;
  }
  .factor-row:last-child { border-bottom: none; }
  .factor-row .fk { color: var(--ink-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; }
  .factor-row .fv { color: var(--ink); font-size: 12px; text-align: right; }
  .factor-row .fv.pos { color: var(--green); }
  .factor-row .fv.neg { color: var(--red); }
  .factor-row .fv.warn { color: var(--amber); }

  .option-strike {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .option-strike .strike-label { color: var(--ink-faint); text-transform: uppercase; font-size: 10px; letter-spacing: 0.15em; margin-bottom: 8px; }
  .option-strike .strike-greek { color: var(--ink-dim); margin-top: 4px; font-size: 11px; }

  .tier-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tier-row.two-tiers { grid-template-columns: repeat(2, 1fr); }
  .tier-row.one-tier { grid-template-columns: 1fr; }

  .tier-pill {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.4;
    position: relative;
  }
  .tier-pill .pill-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .tier-pill .pill-contract { font-family: 'Fraunces', serif; font-size: 14px; margin-bottom: 2px; }
  .tier-pill .pill-expiry { color: var(--ink-dim); font-size: 10px; margin-bottom: 3px; }
  .tier-pill .pill-greeks { color: var(--ink-dim); font-size: 10px; margin-bottom: 3px; }
  .tier-pill .pill-mid { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .tier-pill .pill-star { position: absolute; top: 5px; right: 7px; font-size: 10px; }

  .tier-pill.aggressive .pill-label { color: var(--red); }
  .tier-pill.aggressive .pill-contract { color: var(--red); }
  .tier-pill.aggressive.recommended { border-color: var(--red); background: rgba(239,68,68,0.06); }

  .tier-pill.moderate .pill-label { color: var(--amber); }
  .tier-pill.moderate .pill-contract { color: var(--amber); }
  .tier-pill.moderate.recommended { border-color: var(--amber); background: rgba(251,191,36,0.06); }

  .tier-pill.conservative .pill-label { color: var(--green); }
  .tier-pill.conservative .pill-contract { color: var(--green); }
  .tier-pill.conservative.recommended { border-color: var(--green); background: rgba(34,197,94,0.06); }

  /* No-trade state */
  .no-trade {
    text-align: center;
    padding: 64px 40px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .no-trade .icon {
    font-family: 'Fraunces', serif;
    font-size: 64px;
    font-weight: 300;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }
  .no-trade h2 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 24px;
    margin-bottom: 8px;
  }
  .no-trade p { color: var(--ink-dim); max-width: 500px; margin: 0 auto; line-height: 1.7; }

  /* Rich no-trade state */
  .no-trade-rich { background: var(--bg-card); border: 1px solid var(--border); padding: 24px 28px; }
  .no-trade-rich-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .no-trade-rich-top .nt-icon { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 300; color: var(--ink-faint); line-height: 1; }
  .no-trade-rich-top h2 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 22px; margin-bottom: 4px; }
  .no-trade-rich-top p { color: var(--ink-dim); font-size: 12px; }
  .no-trade-body { border-top: 1px solid var(--border); padding-top: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 0; }
  @media (max-width: 640px) { .no-trade-body { grid-template-columns: 1fr; } }
  .nt-brief { padding-right: 24px; border-right: 1px solid var(--border); }
  .nt-miss { padding-left: 24px; }
  .nt-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; color: var(--ink-faint); margin-bottom: 12px; font-weight: 500; }
  .readiness-pct { font-family: 'Fraunces', serif; font-size: 28px; color: var(--green); }
  .readiness-sub { font-size: 9px; text-transform: uppercase; letter-spacing: .15em; color: var(--ink-faint); margin-left: 6px; }
  .readiness-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 14px; }
  .readiness-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--green)); border-radius: 3px; }
  .miss-factor { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 11px; }
  .miss-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .miss-dot.pass { background: var(--green); }
  .miss-dot.fail { background: var(--red); }
  .miss-gap { color: var(--red); font-size: 10px; }

  /* Loading state */
  .loading {
    text-align: center;
    padding: 80px 40px;
    color: var(--ink-dim);
  }
  .loading-bar {
    width: 200px;
    height: 2px;
    background: var(--border);
    margin: 24px auto 0;
    overflow: hidden;
    position: relative;
  }
  .loading-bar::after {
    content: '';
    position: absolute;
    left: -40%;
    width: 40%;
    height: 100%;
    background: var(--accent);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { to { left: 100%; } }

  /* Error state */
  .error-box {
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid var(--red);
    border-left: 3px solid var(--red);
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--ink);
  }
  .error-box strong { color: var(--red); }

  /* History section */
  .history-section { margin-top: 48px; }
  .history-header {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 24px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .history-header .count { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.15em; }
  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .history-table th {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
  }
  .history-table td {
    padding: 10px 14px;
    border-bottom: 1px dashed var(--border);
    font-variant-numeric: tabular-nums;
  }
  .history-table tr:last-child td { border-bottom: none; }
  .history-table tr:hover td { background: var(--bg-elevated); }
  .outcome-WIN { color: var(--green); font-weight: 700; }
  .outcome-LOSS { color: var(--red); font-weight: 700; }
  .outcome-OPEN { color: var(--amber); }
  .outcome-EXPIRED { color: var(--ink-faint); }

  /* Footer */
  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Auto-scan */
  .btn-auto-on { border-color: var(--green) !important; color: var(--green) !important; }
  .countdown-display { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; min-width: 130px; }
  @keyframes newSetupPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 97, 0); }
    50% { box-shadow: 0 0 0 12px rgba(201, 169, 97, 0.35); }
  }
  .new-setup { animation: newSetupPulse 1.2s ease-in-out 4; border-color: var(--accent) !important; }

  @media (max-width: 600px) {
    .container { padding: 24px 16px 60px; }
    h1 { font-size: 28px; }
    .rec-head { grid-template-columns: 1fr; gap: 12px; }
    .rec-symbol { font-size: 36px; }
  }

  /* Chart button on setup cards */
  .chart-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--ink-dim);
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    align-self: center;
  }
  .chart-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Chart modal */
  .chart-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 10, 0.88);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .chart-modal {
    background: var(--bg-card);
    border: 1px solid var(--border-bright);
    width: 100%;
    max-width: 900px;
    padding: 20px 24px 24px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .chart-modal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .chart-modal-symbol-block {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chart-modal-symbol {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .chart-modal-meta { font-size: 11px; color: var(--ink-dim); }
  .chart-modal-controls { display: flex; align-items: center; gap: 10px; }
  .timeframe-toggle {
    display: inline-flex;
    border: 1px solid var(--border-bright);
    border-radius: 3px;
    overflow: hidden;
  }
  .tf-btn {
    padding: 5px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    transition: all 0.12s;
  }
  .tf-btn.active { background: var(--bg-elevated); color: var(--ink); }
  .tf-btn:hover { color: var(--ink); }
  .chart-container { height: 340px; }
  .chart-legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 11px;
  }
  .chart-legend-item { display: flex; align-items: center; gap: 6px; }
  .chart-legend-swatch { width: 20px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  .chart-legend-name { color: var(--ink-faint); text-transform: uppercase; font-size: 9px; letter-spacing: 0.12em; }
  .chart-legend-val { font-weight: 500; }
  .chart-close-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--ink-dim);
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chart-close-btn:hover { border-color: var(--red); color: var(--red); }
  .direction.CALL { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid var(--green); }
  .direction.PUT  { background: rgba(248, 113, 113, 0.15); color: var(--red);   border: 1px solid var(--red);  }
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1>Pre-Market <em>Research</em> Desk</h1>
      <div class="subtitle">SPY · QQQ · Supply & Demand + Volume Confirmation</div>
    </div>
    <div class="meta">
      <div class="date" id="todayDate"></div>
      <div style="margin-top: 6px;">
        <span class="status-dot idle" id="statusDot"></span>
        <span id="statusText">Ready to scan</span>
      </div>
    </div>
  </header>

  <div class="scan-bar">
    <button class="primary" onclick="runScan()" id="scanBtn">Run Morning Scan</button>
    <button id="autoScanBtn" onclick="toggleAutoScan()">Auto-Scan: Off</button>
    <button onclick="toggleHistory()" id="historyBtn">View History</button>
    <span class="last-scan" id="lastScan"></span>
    <span class="countdown-display" id="countdown" style="display:none"></span>
  </div>

  <div id="trackerBar"></div>
  <div id="errorBox"></div>
  <div id="macroBanner"></div>
  <div id="recsArea">
    <div class="loading" style="display:none;" id="loadingBox">
      Scanning SPY and QQQ…
      <div class="loading-bar"></div>
    </div>
  </div>

  <div id="historySection" class="history-section" style="display:none">
    <div class="history-header">
      Trade History
      <span class="count" id="historyCount"></span>
    </div>
    <div id="historyTable"></div>
  </div>

  <footer>Not financial advice · Local dashboard · v0.2</footer>
</div>

<div id="chartModal" class="chart-modal-backdrop" style="display:none" onclick="closeChartModal(event)">
  <div class="chart-modal" onclick="event.stopPropagation()">
    <div class="chart-modal-topbar">
      <div class="chart-modal-symbol-block">
        <div class="chart-modal-symbol" id="chartModalSymbol"></div>
        <div id="chartModalBadge" class="direction" style="padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:0.15em"></div>
        <div class="chart-modal-meta" id="chartModalMeta"></div>
      </div>
      <div class="chart-modal-controls">
        <div class="timeframe-toggle">
          <button class="tf-btn active" id="tfBtn30m" onclick="switchChartTimeframe('30m')">30m</button>
          <button class="tf-btn" id="tfBtn1D" onclick="switchChartTimeframe('1D')">1D</button>
        </div>
        <button class="chart-close-btn" onclick="closeChartModal()">✕ Close</button>
      </div>
    </div>
    <div id="chartContainer" class="chart-container"></div>
    <div id="chartLegend" class="chart-legend"></div>
  </div>
</div>

<script>
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
});

let lastScanTime = null;
const loading = document.getElementById('loadingBox');
let _currentSetups = [];

// Auto-scan state
let previousFingerprints = new Set();
let _pendingNewSetups = new Set();
let autoScanEnabled = false;
let autoScanTimer = null;
let countdownInterval = null;
let secondsUntilScan = 600;

function setupFingerprint(s) {
  return `${s.instrument}_${s.direction}_${s.zone_bottom.toFixed(2)}`;
}

async function runScan(fromAuto = false) {
  const btn = document.getElementById('scanBtn');
  const recsArea = document.getElementById('recsArea');
  const errBox = document.getElementById('errorBox');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  btn.disabled = true;
  errBox.innerHTML = '';
  recsArea.innerHTML = '';
  loading.style.display = 'block';
  recsArea.appendChild(loading);
  dot.className = 'status-dot idle';
  statusText.textContent = 'Scanning…';

  try {
    const resp = await fetch('/api/scan');
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    if (data.market_closed) {
      renderTracker(data.tracker_stats);
      dot.className = 'status-dot idle';
      statusText.textContent = 'Markets closed';
      recsArea.innerHTML = `
        <div class="no-trade">
          <div class="icon">—</div>
          <h2>Markets are closed</h2>
          <p>${data.market_closed} Historical tracker stats are shown above.</p>
        </div>`;
      return;
    }

    const viable = (data.setups || []).filter(s => s && s.conviction_score !== undefined);

    // Detect new setups on auto-scan (skip first auto-scan which seeds fingerprints)
    _pendingNewSetups.clear();
    if (fromAuto && previousFingerprints.size > 0) {
      const newSetups = viable.filter(s => !previousFingerprints.has(setupFingerprint(s)));
      newSetups.forEach(s => _pendingNewSetups.add(setupFingerprint(s)));
      if (newSetups.length > 0) notifyNewSetups(newSetups);
    }

    renderTracker(data.tracker_stats);
    renderMacro(data.macro_summary);
    renderRecommendations(data.setups || [], data);
    _pendingNewSetups.clear();

    // Seed/update fingerprints for next comparison
    previousFingerprints = new Set(viable.map(s => setupFingerprint(s)));

    dot.className = 'status-dot live';
    lastScanTime = new Date();
    statusText.textContent = fromAuto ? 'Auto-scan complete' : 'Scan complete';
    document.getElementById('lastScan').textContent =
      `Last scan: ${lastScanTime.toLocaleTimeString()}`;
  } catch (e) {
    dot.className = 'status-dot error';
    statusText.textContent = 'Scan failed';
    errBox.innerHTML = `<div class="error-box"><strong>Error:</strong> ${e.message}<br>
      Check that the backend is running and API credentials are configured (see SETUP.md).</div>`;
    recsArea.innerHTML = '';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

// ── Auto-scan ────────────────────────────────────────────────────────

function toggleAutoScan() {
  if (autoScanEnabled) stopAutoScan(); else startAutoScan();
}

function startAutoScan() {
  autoScanEnabled = true;
  const btn = document.getElementById('autoScanBtn');
  btn.textContent = 'Auto-Scan: On';
  btn.classList.add('btn-auto-on');
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  runScanAuto();
}

function stopAutoScan() {
  autoScanEnabled = false;
  clearTimeout(autoScanTimer);
  clearInterval(countdownInterval);
  const btn = document.getElementById('autoScanBtn');
  btn.textContent = 'Auto-Scan: Off';
  btn.classList.remove('btn-auto-on');
  document.getElementById('countdown').style.display = 'none';
}

async function runScanAuto() {
  if (!autoScanEnabled) return;
  await runScan(true);
  if (autoScanEnabled) scheduleNextAutoScan();
}

function scheduleNextAutoScan() {
  secondsUntilScan = 600;
  const el = document.getElementById('countdown');
  el.style.display = 'inline';
  updateCountdown();
  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => { secondsUntilScan--; updateCountdown(); }, 1000);
  clearTimeout(autoScanTimer);
  autoScanTimer = setTimeout(runScanAuto, 600000);
}

function updateCountdown() {
  const s = Math.max(0, secondsUntilScan);
  const m = Math.floor(s / 60);
  document.getElementById('countdown').textContent =
    `Next scan in ${m}:${(s % 60).toString().padStart(2, '0')}`;
}

function notifyNewSetups(setups) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const body = setups.map(s => `${s.instrument} ${s.direction} · ${s.conviction_label}`).join('\n');
    new Notification('New Setup Found', { body });
  }
  playChime();
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.16;
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.start(t);
      osc.stop(t + 0.5);
    });
  } catch (e) { /* AudioContext unavailable */ }
}

function renderTracker(stats) {
  const area = document.getElementById('trackerBar');
  if (!stats || stats.total === 0) {
    area.innerHTML = `<div class="tracker">
      <div class="tracker-item">
        <div class="label">Outcome Tracking</div>
        <div class="value" style="font-size:14px;color:var(--ink-dim);">Collecting data…</div>
        <div class="detail">Results will appear after ~10 recommendations have resolved.</div>
      </div>
    </div>`;
    return;
  }
  const wr = stats.win_rate != null ? `${stats.win_rate}%` : '—';
  const hConv = stats.by_conviction.High;
  const mConv = stats.by_conviction.Medium;
  area.innerHTML = `
    <div class="tracker">
      <div class="tracker-item">
        <div class="label">Last ${stats.days} days</div>
        <div class="value">${stats.total} recs</div>
        <div class="detail">${stats.wins}W / ${stats.losses}L / ${stats.open} open</div>
      </div>
      <div class="tracker-item">
        <div class="label">Overall win rate</div>
        <div class="value">${wr}</div>
        <div class="detail">Closed trades only</div>
      </div>
      <div class="tracker-item">
        <div class="label">High conviction</div>
        <div class="value">${hConv.win_rate != null ? hConv.win_rate + '%' : '—'}</div>
        <div class="detail">${hConv.w}W / ${hConv.l}L · ${hConv.total} closed</div>
      </div>
      <div class="tracker-item">
        <div class="label">Medium conviction</div>
        <div class="value">${mConv.win_rate != null ? mConv.win_rate + '%' : '—'}</div>
        <div class="detail">${mConv.w}W / ${mConv.l}L · ${mConv.total} closed</div>
      </div>
    </div>
  `;
}

function renderMacro(macro) {
  const area = document.getElementById('macroBanner');
  if (!macro) { area.innerHTML = ''; return; }
  const events = macro.high_impact_events || [];
  const earnings = macro.earnings_today || [];
  const all = macro.all_events || [];

  const eventPills = events.slice(0, 6).map(e => `
    <div class="macro-event high">
      <span class="time">${fmtTime(e.time)}</span>
      <span class="name">${e.event || '—'}</span>
    </div>
  `).join('');

  const earningsPills = earnings.map(e => `
    <div class="macro-event">
      <span class="time">${e.hour || ''}</span>
      <span class="name">${e.symbol} earnings</span>
    </div>
  `).join('');

  const mediumEvents = all.filter(e => e.impact === 'medium').slice(0, 4).map(e => `
    <div class="macro-event">
      <span class="time">${fmtTime(e.time)}</span>
      <span class="name">${e.event || '—'}</span>
    </div>
  `).join('');

  const hasAny = eventPills || earningsPills || mediumEvents;
  area.innerHTML = `
    <div class="macro-banner">
      <h3>Macro Calendar · Today</h3>
      <div class="macro-events">
        ${hasAny ? (eventPills + earningsPills + mediumEvents) : '<div class="no-events">No high-impact events scheduled.</div>'}
      </div>
    </div>
  `;
}

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit',
      timeZone: 'America/New_York'
    }) + ' ET';
  } catch { return iso; }
}

function renderRecommendations(setups, data) {
  const area = document.getElementById('recsArea');
  const viable = (setups || []).filter(s => s && s.conviction_score !== undefined);

  if (viable.length === 0) {
    const brief = (data && data.daily_brief) || {};
    const miss = data && data.closest_miss;
    const macro = (data && data.macro_summary) || {};
    const spyB = brief.SPY || {};
    const qqqB = brief.QQQ || {};
    const macroCount = (macro.high_impact_events || []).length + (macro.earnings_today || []).length;

    const trendIcon = t => t === 'up' ? '↑' : t === 'down' ? '↓' : '→';
    const trendCol  = t => t === 'up' ? 'var(--green)' : t === 'down' ? 'var(--red)' : 'var(--ink-dim)';
    const volCol    = r => r >= 1.0 ? 'var(--green)' : 'var(--amber)';

    const briefRows = `
      <div class="level-row"><span class="k">SPY trend</span><span class="v" style="color:${trendCol(spyB.trend)}">${trendIcon(spyB.trend)} ${spyB.trend || '—'}</span></div>
      <div class="level-row"><span class="k">QQQ trend</span><span class="v" style="color:${trendCol(qqqB.trend)}">${trendIcon(qqqB.trend)} ${qqqB.trend || '—'}</span></div>
      <div class="level-row"><span class="k">Volume</span><span class="v" style="color:${spyB.volume_ratio != null ? volCol(spyB.volume_ratio) : ''}">${spyB.volume_ratio != null ? spyB.volume_ratio + 'x avg' : '—'}</span></div>
      <div class="level-row"><span class="k">Zones found</span><span class="v">SPY ${spyB.zones_detected ?? 0} · QQQ ${qqqB.zones_detected ?? 0}</span></div>
      <div class="level-row"><span class="k">Macro events</span><span class="v" style="color:${macroCount > 0 ? 'var(--amber)' : 'var(--green)'}">${macroCount > 0 ? macroCount + ' today' : 'None'}</span></div>
    `;

    let missHtml = '<div style="color:var(--ink-faint);font-size:12px;padding-top:8px;font-style:italic">No zones detected — nothing to score.</div>';
    if (miss) {
      const pct = miss.readiness_pct;
      const passRows = (miss.passed || []).map(p =>
        `<div class="miss-factor"><div class="miss-dot pass"></div><span style="color:var(--ink)">${p}</span></div>`
      ).join('');
      const failRows = (miss.failed || []).map(f =>
        `<div class="miss-factor"><div class="miss-dot fail"></div><span style="color:var(--ink-dim)">${f.factor} <span style="color:var(--ink)">${f.have}</span> <span class="miss-gap">(${f.gap})</span></span></div>`
      ).join('');
      missHtml = `
        <div style="margin-bottom:6px">
          <span class="readiness-pct">${pct}%</span>
          <span class="readiness-sub">to a setup</span>
        </div>
        <div class="readiness-bar"><div class="readiness-fill" style="width:${pct}%"></div></div>
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-faint);margin-bottom:8px">${miss.symbol} · ${miss.direction}</div>
        ${passRows}${failRows}
      `;
    }

    area.innerHTML = `
      <div class="recs-header">Today's Setups <span class="count">None qualify</span></div>
      <div class="no-trade-rich">
        <div class="no-trade-rich-top">
          <div class="nt-icon">∅</div>
          <div>
            <h2>No qualifying setup</h2>
            <p>Here's what the market looks like right now.</p>
          </div>
        </div>
        <div class="no-trade-body">
          <div class="nt-brief">
            <div class="nt-section-label">Morning Brief</div>
            ${briefRows}
          </div>
          <div class="nt-miss">
            <div class="nt-section-label">Closest Miss${miss ? ' · ' + miss.symbol : ''}</div>
            ${missHtml}
          </div>
        </div>
      </div>
    `;
    return;
  }

  const top = viable.slice(0, 4);
  _currentSetups = top;
  area.innerHTML = `
    <div class="recs-header">
      Today's Setups
      <span class="count">${top.length} recommendation${top.length > 1 ? 's' : ''}</span>
    </div>
    ${top.map((s, i) => renderRecCard(s, i)).join('')}
  `;
}

function renderRecCard(s, index) {
  const isNew = _pendingNewSetups.has(setupFingerprint(s));
  const conviction = (s.conviction_label || 'Low').toLowerCase();
  const zoneRange = `${s.zone_bottom.toFixed(2)} – ${s.zone_top.toFixed(2)}`;
  const confluenceStr = (s.confluence_factors || []).length
    ? s.confluence_factors.map(f => f.replace(/_/g, ' ')).join(', ')
    : 'none';
  const styleLabel = s.trade_style === 'scalp' ? 'SCALP' : 'SWING';
  const styleCls = s.trade_style === 'scalp' ? 'scalp' : 'swing';

  const tiers = s.strike_tiers;
  let strikeBlock;
  if (tiers && tiers.length > 0) {
    const colsCls = tiers.length === 1 ? 'one-tier' : tiers.length === 2 ? 'two-tiers' : '';
    const pills = tiers.map(t => {
      const monthDay = t.expiration
        ? new Date(t.expiration + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : '—';
      const recCls = t.recommended ? ' recommended' : '';
      const star = t.recommended ? `<span class="pill-star">★</span>` : '';
      return `
        <div class="tier-pill ${t.tier}${recCls}">
          ${star}
          <div class="pill-label">${t.tier}</div>
          <div class="pill-contract">${t.symbol}</div>
          <div class="pill-expiry">${monthDay} · ${t.dte}dte</div>
          <div class="pill-greeks">Δ ${t.delta != null ? Math.abs(t.delta).toFixed(2) : '—'} · IV ${t.iv != null ? (t.iv * 100).toFixed(1) + '%' : '—'}</div>
          <div class="pill-mid">${t.mid != null ? '~$' + t.mid : '—'}</div>
        </div>`;
    }).join('');
    strikeBlock = `
      <div class="option-strike">
        <div class="strike-label">Suggested contracts</div>
        <div class="tier-row ${colsCls}">${pills}</div>
      </div>`;
  } else {
    strikeBlock = `
      <div class="option-strike">
        <div class="strike-label">Suggested contracts</div>
        <div class="strike-greek">Fetch option chain to populate strike (requires Schwab auth).</div>
      </div>`;
  }

  const breakdown = s.conviction_breakdown || {};
  const breakdownRows = Object.entries(breakdown).map(([k, v]) => {
    const isPos = v.includes('+1') || v.includes('+2');
    const isNeg = v.includes('−');
    const cls = isPos ? 'pos' : (isNeg ? 'neg' : '');
    return `
      <div class="factor-row">
        <span class="fk">${k.replace(/_/g, ' ')}</span>
        <span class="fv ${cls}">${v}</span>
      </div>
    `;
  }).join('');

  const macroFlag = s.macro?.hostile
    ? `<div class="factor-row"><span class="fk">Macro risk</span><span class="fv warn">Event during hold window</span></div>`
    : `<div class="factor-row"><span class="fk">Macro risk</span><span class="fv pos">Clear</span></div>`;

  return `
    <div class="rec-card ${conviction}${isNew ? ' new-setup' : ''}">
      <div class="rec-head">
        <div class="rec-symbol">${s.instrument}</div>
        <div class="rec-summary">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <div class="direction ${s.direction}">${s.direction}</div>
            <div class="style-badge ${styleCls}">${styleLabel}</div>
          </div>
          <div class="headline">${buildHeadline(s)}</div>
          <div class="subline">
            Current ${s.current_price.toFixed(2)} · Zone ${zoneRange} · R:R 1:${s.rr_ratio}
          </div>
        </div>
        <button class="chart-btn" onclick="openChartModal(${index})">📈 View Chart</button>
        <div class="rec-conviction">
          <div class="label">Conviction</div>
          <div class="value ${s.conviction_label}">${s.conviction_label}</div>
          <div class="score">Score ${s.conviction_score}/10</div>
        </div>
      </div>
      <div class="rec-body">
        <div class="rec-levels">
          <h4>Trade Framework</h4>
          <div class="level-row"><span class="k">Entry trigger</span><span class="v accent">${s.entry_trigger}</span></div>
          <div class="level-row"><span class="k">Stop loss</span><span class="v stop">${s.stop}</span></div>
          <div class="level-row"><span class="k">Target</span><span class="v target">${s.target}</span></div>
          <div class="level-row"><span class="k">Risk</span><span class="v">${s.risk_points} pts</span></div>
          <div class="level-row"><span class="k">Reward</span><span class="v">${s.reward_points} pts</span></div>
          <div class="level-row"><span class="k">Confluence</span><span class="v">${confluenceStr}</span></div>
          ${strikeBlock}
        </div>
        <div class="rec-factors">
          <h4>Factor Breakdown</h4>
          ${breakdownRows}
          ${macroFlag}
        </div>
      </div>
    </div>
  `;
}

let historyLoaded = false;

function toggleHistory() {
  const section = document.getElementById('historySection');
  const btn = document.getElementById('historyBtn');
  if (!historyLoaded) {
    loadHistory();
    historyLoaded = true;
  } else if (section.style.display === 'none') {
    section.style.display = 'block';
    btn.textContent = 'Hide History';
  } else {
    section.style.display = 'none';
    btn.textContent = 'View History';
  }
}

async function loadHistory() {
  const section = document.getElementById('historySection');
  const tableDiv = document.getElementById('historyTable');
  const btn = document.getElementById('historyBtn');
  section.style.display = 'block';
  btn.textContent = 'Hide History';
  tableDiv.innerHTML = '<div style="color:var(--ink-dim);padding:20px 0">Loading…</div>';
  try {
    const resp = await fetch('/api/history?limit=30');
    const rows = await resp.json();
    document.getElementById('historyCount').textContent = `${rows.length} trades`;
    if (rows.length === 0) {
      tableDiv.innerHTML = '<div style="color:var(--ink-dim);padding:20px 0">No recommendations recorded yet.</div>';
      return;
    }
    tableDiv.innerHTML = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Date</th><th>Symbol</th><th>Dir</th><th>Conviction</th>
            <th>Entry</th><th>Stop</th><th>Target</th><th>R:R</th><th>Outcome</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r.recorded_at.split('T')[0]}</td>
              <td>${r.symbol}</td>
              <td class="direction ${r.direction}" style="font-size:11px;font-weight:700">${r.direction}</td>
              <td>${r.conviction_label || '—'}</td>
              <td>${r.entry_trigger_price != null ? r.entry_trigger_price.toFixed(2) : '—'}</td>
              <td style="color:var(--red)">${r.stop != null ? r.stop.toFixed(2) : '—'}</td>
              <td style="color:var(--green)">${r.target != null ? r.target.toFixed(2) : '—'}</td>
              <td>1:${r.rr_ratio != null ? r.rr_ratio.toFixed(1) : '—'}</td>
              <td class="outcome-${(r.outcome || 'open').toUpperCase()}">${(r.outcome || 'open').toUpperCase()}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    tableDiv.innerHTML = `<div class="error-box">Failed to load history: ${e.message}</div>`;
  }
}

function buildHeadline(setup) {
  const zoneType = setup.direction === 'CALL' ? 'demand' : 'supply';
  const status = setup.zone_status || (setup.zone_fresh ? 'fresh' : 'tested');
  const statusLabel = status === 'fresh' ? 'Fresh' : 'Tested & holding';
  const vol = setup.volume_origin_ratio >= 1.8 ? 'high-volume' :
              setup.volume_origin_ratio >= 1.3 ? 'moderate-volume' : 'low-volume';
  return `${statusLabel} ${vol} ${zoneType} zone reaction.`;
}

// ── Chart modal ────────────────────────────────────────────────

let _chartData   = null;  // { symbol, intraday: [], daily: [] }
let _chartSetup  = null;  // setup object for the open card
let _chartTf     = '30m'; // active timeframe toggle
let _chartInst   = null;  // LightweightCharts instance
let _candleSeries = null;
let _chartResizeObserver = null;

async function openChartModal(index) {
  const setup = _currentSetups[index];
  if (!setup) return;
  _chartSetup = setup;
  _chartTf = '30m';

  // Populate topbar
  document.getElementById('chartModalSymbol').textContent = setup.instrument;
  const badge = document.getElementById('chartModalBadge');
  badge.className = `direction ${setup.direction}`;
  badge.style.cssText = 'padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:0.15em';
  badge.textContent = setup.direction;
  document.getElementById('chartModalMeta').textContent =
    `Current ${setup.current_price.toFixed(2)} · Score ${setup.conviction_score}/10`;

  // Show modal
  document.getElementById('chartModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  _setActiveTfBtn('30m');

  // Loading placeholder
  const container = document.getElementById('chartContainer');
  container.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:12px">Loading chart…</div>';
  document.getElementById('chartLegend').innerHTML = '';

  try {
    const resp = await fetch(`/api/chart/${setup.instrument}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    _chartData = data;
    container.innerHTML = '';
    _renderChart('30m');
  } catch (e) {
    container.innerHTML =
      `<div class="error-box" style="margin:0"><strong>Chart error:</strong> ${e.message}</div>`;
  }
}

function closeChartModal(event) {
  // Allow: direct call (no event) or backdrop click (event.target === backdrop)
  if (event && event.target !== document.getElementById('chartModal')) return;
  document.getElementById('chartModal').style.display = 'none';
  document.body.style.overflow = '';
  if (_chartResizeObserver) { _chartResizeObserver.disconnect(); _chartResizeObserver = null; }
  if (_chartInst) { _chartInst.remove(); _chartInst = null; _candleSeries = null; }
  _chartData = null;
  _chartSetup = null;
}

function switchChartTimeframe(tf) {
  if (!_chartData || tf === _chartTf) return;
  _chartTf = tf;
  _setActiveTfBtn(tf);
  if (_chartResizeObserver) { _chartResizeObserver.disconnect(); _chartResizeObserver = null; }
  if (_chartInst) { _chartInst.remove(); _chartInst = null; _candleSeries = null; }
  document.getElementById('chartContainer').innerHTML = '';
  _renderChart(tf);
}

function _setActiveTfBtn(tf) {
  document.getElementById('tfBtn30m').className = tf === '30m' ? 'tf-btn active' : 'tf-btn';
  document.getElementById('tfBtn1D').className  = tf === '1D'  ? 'tf-btn active' : 'tf-btn';
}

function _renderChart(tf) {
  const container = document.getElementById('chartContainer');
  const setup = _chartSetup;
  const candles = tf === '30m' ? _chartData.intraday : _chartData.daily;

  _chartInst = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: 340,
    layout: { background: { color: '#0a0d12' }, textColor: '#8a95a8' },
    grid: { vertLines: { color: '#1a2030' }, horzLines: { color: '#1a2030' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#242b38' },
    timeScale: { borderColor: '#242b38', timeVisible: true },
  });

  _candleSeries = _chartInst.addCandlestickSeries({
    upColor: '#4ade80', downColor: '#f87171',
    borderUpColor: '#4ade80', borderDownColor: '#f87171',
    wickUpColor: '#4ade80', wickDownColor: '#f87171',
  });

  // Schwab returns datetime in milliseconds; Lightweight Charts expects seconds
  _candleSeries.setData(
    candles
      .map(c => ({ time: Math.floor(c.datetime / 1000), open: c.open, high: c.high, low: c.low, close: c.close }))
      .sort((a, b) => a.time - b.time)
  );

  // Entry price: zone_top for CALL (break above), zone_bottom for PUT (break below)
  const entryPrice = setup.direction === 'CALL' ? setup.zone_top : setup.zone_bottom;

  const overlays = [
    { price: setup.target,    color: '#4ade80', style: LightweightCharts.LineStyle.Dashed, title: 'Target'  },
    { price: entryPrice,      color: '#60a5fa', style: LightweightCharts.LineStyle.Solid,  title: 'Entry'   },
    { price: setup.zone_top,  color: '#c9a961', style: LightweightCharts.LineStyle.Dashed, title: 'Zone ▲'  },
    { price: setup.zone_bottom, color: '#c9a961', style: LightweightCharts.LineStyle.Dashed, title: 'Zone ▼' },
    { price: setup.stop,      color: '#f87171', style: LightweightCharts.LineStyle.Dashed, title: 'Stop'    },
    { price: setup.current_price, color: '#5a6578', style: LightweightCharts.LineStyle.Solid, title: 'Price' },
  ];
  overlays.forEach(({ price, color, style, title }) => {
    _candleSeries.createPriceLine({ price, color, lineStyle: style, lineWidth: 1, axisLabelVisible: true, title });
  });

  _chartInst.timeScale().fitContent();

  // Resize handler so chart fills container if window is resized
  _chartResizeObserver = new ResizeObserver(() => {
    if (_chartInst) _chartInst.applyOptions({ width: container.clientWidth });
  });
  _chartResizeObserver.observe(container);

  _renderChartLegend(setup, entryPrice);
}

function _renderChartLegend(setup, entryPrice) {
  const items = [
    { label: 'Target',  val: setup.target.toFixed(2),           color: '#4ade80' },
    { label: 'Entry',   val: entryPrice.toFixed(2),              color: '#60a5fa' },
    { label: 'Zone',    val: `${setup.zone_bottom.toFixed(2)} – ${setup.zone_top.toFixed(2)}`, color: '#c9a961' },
    { label: 'Stop',    val: setup.stop.toFixed(2),              color: '#f87171' },
    { label: 'Current', val: setup.current_price.toFixed(2),    color: '#8a95a8' },
  ];
  document.getElementById('chartLegend').innerHTML = items.map(({ label, val, color }) => `
    <div class="chart-legend-item">
      <div class="chart-legend-swatch" style="background:${color}"></div>
      <span class="chart-legend-name">${label}</span>
      <span class="chart-legend-val" style="color:${color}">${val}</span>
    </div>
  `).join('');
}

// Close modal on ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('chartModal').style.display !== 'none') {
    closeChartModal();
  }
});
</script>
</body>
</html>
